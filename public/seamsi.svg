<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="envBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e8528"/>
      <stop offset="100%" stop-color="#1e5c19"/>
    </linearGradient>
    <linearGradient id="envMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#379930"/>
      <stop offset="100%" stop-color="#246e1e"/>
    </linearGradient>
    <linearGradient id="envFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ab53e"/>
      <stop offset="55%" stop-color="#389c2e"/>
      <stop offset="100%" stop-color="#287a20"/>
    </linearGradient>
    <linearGradient id="moonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffff7a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Back Envelope (Tilted -38 deg) -->
  <g transform="translate(112, 148) rotate(-38) translate(-55, -85)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="110" height="170" rx="5" fill="url(#envBack)" stroke="#5fd050" stroke-width="1.5"/>
    <line x1="16" y1="8" x2="16" y2="68" stroke="#e2f8dc" stroke-width="2" stroke-linecap="round"/>
    <polygon points="16,64 19,70 26,71 21,75 22,82 16,78 10,82 11,75 6,71 13,70" fill="url(#moonGold)"/>
    <circle cx="32" cy="44" r="3" fill="#dcfce7"/>
    <circle cx="28" cy="96" r="2.5" fill="#fef08a"/>
  </g>

  <!-- Middle Envelope (Tilted -22 deg) -->
  <g transform="translate(128, 138) rotate(-22) translate(-55, -85)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="110" height="170" rx="5" fill="url(#envMid)" stroke="#6ee760" stroke-width="1.5"/>
    <line x1="16" y1="6" x2="16" y2="66" stroke="#ecfdf5" stroke-width="2" stroke-linecap="round"/>
    <polygon points="16,62 19,68 26,69 21,73 22,80 16,76 10,80 11,73 6,69 13,68" fill="url(#moonGold)"/>
    <circle cx="34" cy="36" r="3" fill="#fef08a"/>
    <path d="M55,58 A26,26 0 1,0 82,92 A20,20 0 1,1 55,58 Z" fill="url(#moonGold)"/>
  </g>

  <!-- Front Envelope (Tilted -8 deg) -->
  <g transform="translate(154, 128) rotate(-8) translate(-58, -88)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="116" height="176" rx="5" fill="url(#envFront)" stroke="#86efac" stroke-width="1.8"/>

    <!-- Hanging String Lines -->
    <line x1="15" y1="8" x2="15" y2="66" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="56" y1="4" x2="56" y2="48" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="66" y1="4" x2="66" y2="18" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="88" y1="4" x2="88" y2="48" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Crescent Moon -->
    <path d="M62,46 A27,27 0 1,0 92,86 A21,21 0 1,1 62,46 Z" fill="url(#moonGold)"/>

    <!-- Hanging Stars -->
    <polygon points="15,62 18,68 25,69 20,74 21,81 15,77 9,81 10,74 5,69 12,68" fill="url(#moonGold)"/>
    <polygon points="66,14 68,19 74,20 70,24 71,29 66,26 61,29 62,24 58,20 64,19" fill="url(#moonGold)"/>
    <polygon points="88,44 92,52 100,53 94,59 96,67 88,63 80,67 82,59 76,53 84,52" fill="url(#moonGold)"/>

    <!-- Twinkling Dots -->
    <circle cx="34" cy="36" r="2.8" fill="#fef9c3"/>
    <circle cx="42" cy="54" r="2.5" fill="#fef08a"/>
    <circle cx="102" cy="36" r="3.2" fill="#fef9c3"/>
    <circle cx="104" cy="60" r="2.5" fill="#ffffff"/>
    <circle cx="38" cy="112" r="2.6" fill="#ffffff"/>
    <circle cx="102" cy="122" r="2.6" fill="#ffffff"/>
    <circle cx="20" cy="144" r="2.6" fill="#ffffff"/>

    <!-- Calligraphy Script Lines -->
    <text x="58" y="122" text-anchor="middle" fill="#dcfce7" stroke="#bef264" stroke-width="0.6" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="18">Selamat</text>
    <text x="58" y="141" text-anchor="middle" fill="#dcfce7" stroke="#bef264" stroke-width="0.6" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="17">Hari Raya</text>
    <text x="58" y="160" text-anchor="middle" fill="#dcfce7" stroke="#bef264" stroke-width="0.6" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="17">Aidilfitri</text>
  </g>
</svg>

